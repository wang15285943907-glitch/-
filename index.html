<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>PV 实战训练场｜同步与互斥</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: rgba(15, 27, 44, .82);
      --panel-soft: rgba(19, 34, 53, .72);
      --line: rgba(194, 214, 239, .12);
      --text: #edf4fc;
      --muted: #9babc0;
      --amber: #f5bd5c;
      --amber-soft: rgba(245, 189, 92, .12);
      --green: #73d6ad;
      --red: #ff8790;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(66, 105, 153, .19), transparent 38rem),
        radial-gradient(ellipse at 92% 22%, rgba(181, 123, 48, .12), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 26px 0 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 46px; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 750; letter-spacing: .01em; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid rgba(245,189,92,.45); border-radius: 14px; color: var(--amber); background: linear-gradient(145deg, rgba(245,189,92,.18), rgba(245,189,92,.04)); font: 800 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
    .top-meta { color: var(--muted); font-size: 13px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
    .eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 16px rgba(245,189,92,.7); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; letter-spacing: -.035em; }
    .hero-copy { max-width: 680px; margin-bottom: 0; color: #bdcada; font-size: 15px; line-height: 1.8; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .score-card { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; min-width: 152px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 17px; background: rgba(8,17,31,.62); }
    .score-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); font-size: 18px; }
    .score-label { margin-bottom: 2px; color: var(--muted); font-size: 11px; }
    .score-value { font-weight: 800; font-size: 18px; }
    .score-value small { color: #718198; font-size: 12px; font-weight: 500; }
    .progress-wrap { margin-bottom: 20px; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: rgba(226,237,249,.09); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d9983d, #f5d993); box-shadow: 0 0 16px rgba(245,189,92,.28); transition: width .35s ease; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(270px, .75fr); gap: 18px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.2); backdrop-filter: blur(16px); }
    .challenge { padding: clamp(20px, 3vw, 30px); }
    .challenge-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; margin-bottom: 19px; }
    .step-kicker { margin-bottom: 8px; color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .challenge h2 { margin-bottom: 0; font-size: clamp(20px, 2.5vw, 25px); line-height: 1.35; }
    .passed-pill { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 7px 10px; border: 1px solid rgba(115,214,173,.22); border-radius: 99px; background: rgba(115,214,173,.08); color: var(--green); font-size: 11px; font-weight: 700; }
    .scenario { margin-bottom: 21px; padding: 13px 15px; border: 1px solid rgba(245,189,92,.13); border-radius: 13px; background: rgba(245,189,92,.045); color: #c9d4e1; font-size: 13px; line-height: 1.75; }
    .choices { display: grid; gap: 10px; }
    .choice { width: 100%; padding: 15px 16px; border: 1px solid var(--line); border-radius: 15px; background: rgba(3,10,20,.25); color: var(--text); text-align: left; cursor: pointer; transition: .18s ease; }
    .choice:hover { transform: translateY(-1px); border-color: rgba(220,230,241,.25); background: rgba(255,255,255,.035); }
    .choice.selected { border-color: rgba(245,189,92,.62); background: var(--amber-soft); box-shadow: 0 0 0 2px rgba(245,189,92,.06); }
    .choice:disabled { cursor: default; }
    .choice-title { display: block; font-weight: 700; line-height: 1.6; }
    .choice-detail { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .order-box { display: flex; min-height: 62px; flex-wrap: wrap; align-items: center; gap: 8px; margin: 13px 0 16px; padding: 11px; border: 1px dashed rgba(198,215,237,.2); border-radius: 14px; background: rgba(2,9,18,.3); }
    .empty-hint { color: #718198; font-size: 12px; }
    .order-chip { padding: 9px 11px; border: 1px solid rgba(245,189,92,.28); border-radius: 10px; background: rgba(245,189,92,.09); color: #ffe2aa; font-size: 12px; cursor: pointer; }
    .order-chip b { margin-right: 7px; color: var(--amber); }
    .action-bank { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .action-btn { min-height: 44px; padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.035); color: #d7e0ec; font-size: 12px; font-weight: 650; cursor: pointer; transition: .18s ease; }
    .action-btn:hover { border-color: rgba(245,189,92,.36); background: rgba(245,189,92,.07); }
    .value-list { display: grid; gap: 10px; }
    .value-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(3,10,20,.22); }
    .value-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px; }
    .value-name code { color: #ffdda0; font-weight: 800; }
    .value-name span { color: var(--muted); font-size: 12px; }
    .value-options { display: flex; gap: 7px; }
    .value-btn { min-width: 43px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.025); color: #c8d3e0; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; }
    .value-btn.selected { border-color: rgba(245,189,92,.6); background: var(--amber-soft); color: #ffe1a4; }
    .feedback { display: flex; gap: 11px; align-items: start; margin-top: 17px; padding: 13px 14px; border: 1px solid; border-radius: 13px; font-size: 13px; line-height: 1.75; }
    .feedback.good { border-color: rgba(115,214,173,.22); background: rgba(115,214,173,.075); color: #c8f3df; }
    .feedback.try { border-color: rgba(255,135,144,.22); background: rgba(255,135,144,.07); color: #ffd6d9; }
    .feedback-mark { flex: 0 0 auto; font-weight: 900; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--line); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; color: #c5d0df; background: transparent; font-size: 13px; font-weight: 700; cursor: pointer; transition: .18s ease; }
    .btn:hover { border-color: rgba(219,230,242,.26); color: white; }
    .btn-primary { border-color: transparent; background: linear-gradient(115deg, #e8a63f, #f6cd78); color: #1b1b20; box-shadow: 0 8px 22px rgba(208,145,52,.16); }
    .btn-primary:hover { filter: brightness(1.07); color: #11151b; transform: translateY(-1px); }
    .btn-primary:disabled { border-color: transparent; background: rgba(226,237,249,.09); color: #68788d; box-shadow: none; cursor: not-allowed; transform: none; }
    .side { display: grid; gap: 14px; }
    .side-panel { padding: 20px; }
    .side-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; font-size: 14px; font-weight: 800; }
    .side-note { color: #718198; font-size: 10px; font-weight: 500; }
    .checklist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .check-item { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 7px 9px; border: 1px solid transparent; border-radius: 11px; color: #78879b; font-size: 12px; }
    .check-item.current { border-color: rgba(245,189,92,.2); background: rgba(245,189,92,.07); color: #ffe1a4; }
    .check-item.done { color: #a9e6ca; }
    .check-num { display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto; border-radius: 8px; background: rgba(255,255,255,.055); font-size: 10px; font-weight: 800; }
    .check-item.done .check-num { background: rgba(115,214,173,.12); color: var(--green); }
    .current-tag { margin-left: auto; color: var(--amber); font-size: 9px; font-weight: 800; letter-spacing: .1em; }
    .sem-list { display: grid; gap: 12px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .sem-list p { margin: 0; }
    .sem-list code { color: #ffdda0; font-weight: 700; }
    .deadlock-card { border-color: rgba(245,189,92,.16); background: linear-gradient(145deg, rgba(245,189,92,.075), rgba(15,27,44,.8)); }
    .deadlock-card p { margin: 0; color: #b9c6d5; font-size: 12px; line-height: 1.8; }
    .footer-note { margin: 18px 0 0; color: #68778b; font-size: 11px; text-align: center; }
    .complete { padding: clamp(24px, 5vw, 48px); }
    .trophy { display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 20px; border: 1px solid rgba(245,189,92,.3); border-radius: 18px; background: var(--amber-soft); color: var(--amber); font-size: 25px; }
    .complete-copy { max-width: 720px; color: #bdcada; font-size: 14px; line-height: 1.8; }
    .code-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 24px; }
    .code-card { overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: rgba(2,9,18,.42); }
    .code-label { padding: 12px 14px; border-bottom: 1px solid var(--line); color: #ffdda0; font-size: 12px; font-weight: 800; }
    pre { overflow-x: auto; margin: 0; padding: 14px; color: #dce5ef; font: 12px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .initials { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: rgba(2,9,18,.35); color: #c5d0df; font-size: 12px; line-height: 1.8; }
    .initials code { margin: 0 4px; color: #ffe1a4; }
    .complete-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 23px; }
    .path-summary { color: var(--muted); font-size: 11px; line-height: 1.7; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    button:focus-visible { outline: 3px solid rgba(245,189,92,.58); outline-offset: 3px; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .side { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .side-panel:first-child { grid-row: span 2; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 560px); padding-top: 16px; }
      .topbar { margin-bottom: 30px; }
      .top-meta { font-size: 11px; text-align: right; }
      .hero { align-items: start; flex-direction: column; }
      .score-card { min-width: 0; }
      .side { grid-template-columns: 1fr; }
      .side-panel:first-child { grid-row: auto; }
      .value-row { align-items: start; flex-direction: column; }
      .actions { align-items: stretch; }
      .actions .btn { flex: 1; }
      .code-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PV 实战训练场首页">
        <span class="brand-mark">P/V</span>
        <span>信号量训练场</span>
      </a>
      <div class="top-meta">计算机考研 · 操作系统 408</div>
    </header>
    <main id="app" aria-live="polite"></main>
    <p class="footer-note">每关答错不扣分，读懂提示再继续。进度只保存在当前页面。</p>
  </div>

  <script>
    const STEP_LABELS = ['分清进程', '排列动作', '检查 P/V', '设置初值', '排查死锁', '综合自检'];
    const QUESTION_TITLES = [
      '题目里有哪几类进程？',
      '生产者每轮的 PV 动作怎么排？',
      '消费者怎样安全地取走一个产品？',
      '缓冲区容量为 N，三个信号量初值是多少？',
      '这个 P 顺序会不会把双方卡住？',
      '最后用清单检查整套解法。'
    ];
    const SCENARIOS = [
      '场景：一个有界缓冲区里，生产者把产品放进去，消费者把产品取出来。',
      '只排同步互斥动作；produce() 生成产品的动作不访问缓冲区。',
      '只要消费者访问共享缓冲区，就要进入互斥保护的临界区。',
      '假设缓冲区刚开始是空的，总容量为 N。',
      '假设缓冲区已满，生产者先执行 P(mutex)，随后因 P(empty) 阻塞。',
      '把前面学到的原则合起来，选一套完整且安全的处理方法。'
    ];
    const PRODUCER_ACTIONS = ['P(empty)', 'P(mutex)', '写入缓冲区', 'V(mutex)', 'V(full)'];
    const PRODUCER_ANSWER = ['P(empty)', 'P(mutex)', '写入缓冲区', 'V(mutex)', 'V(full)'];
    const state = {
      current: 0,
      choice: '',
      order: [],
      values: { empty: '', full: '', mutex: '' },
      feedback: null,
      cleared: [],
      score: 0
    };
    const app = document.getElementById('app');

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }

    function scoreCard() {
      return '<div class="score-card"><div class="score-icon" aria-hidden="true">✦</div>' +
        '<div><div class="score-label">本轮得分</div><div class="score-value">' + state.score +
        ' <small>/ 60</small></div></div></div>';
    }

    function choiceButton(id, title, detail) {
      const selected = state.choice === id;
      return '<button type="button" class="choice' + (selected ? ' selected' : '') +
        '" data-choice="' + escapeHTML(id) + '" aria-pressed="' + selected + '"' +
        (state.feedback && state.feedback.correct ? ' disabled' : '') + '>' +
        '<span class="choice-title">' + title + '</span>' +
        (detail ? '<span class="choice-detail">' + detail + '</span>' : '') + '</button>';
    }

    function orderView() {
      let chosen = '';
      if (state.order.length === 0) {
        chosen = '<span class="empty-hint">你的顺序会显示在这里</span>';
      } else {
        chosen = state.order.map(function(action, index) {
          return '<button type="button" class="order-chip" data-remove="' + index +
            '" aria-label="移除第 ' + (index + 1) + ' 个动作"><b>' + (index + 1) + '.</b>' +
            escapeHTML(action) + '</button>';
        }).join('');
      }
      const available = PRODUCER_ACTIONS.filter(function(action) {
        return !state.order.includes(action);
      }).map(function(action) {
        return '<button type="button" class="action-btn" data-action="' + escapeHTML(action) + '"' +
          (state.feedback && state.feedback.correct ? ' disabled' : '') + '>＋ ' +
          escapeHTML(action) + '</button>';
      }).join('');
      return '<p class="hero-copy" style="font-size:13px">点动作卡按先后顺序排好。点已选动作可以移除，再重新安排。</p>' +
        '<div class="order-box">' + chosen + '</div><div class="action-bank">' + available + '</div>';
    }

    function valuesView() {
      const rows = [
        { key: 'empty', label: 'empty', meaning: '空缓冲区数量' },
        { key: 'full', label: 'full', meaning: '已有产品数量' },
        { key: 'mutex', label: 'mutex', meaning: '互斥锁' }
      ];
      return '<div class="value-list">' + rows.map(function(row) {
        return '<div class="value-row"><div class="value-name"><code>' + row.label +
          '</code><span>' + row.meaning + '</span></div><div class="value-options">' +
          ['N', '0', '1'].map(function(value) {
            const selected = state.values[row.key] === value;
            return '<button type="button" class="value-btn' + (selected ? ' selected' : '') +
              '" data-value-key="' + row.key + '" data-value="' + value +
              '" aria-pressed="' + selected + '"' +
              (state.feedback && state.feedback.correct ? ' disabled' : '') + '>' +
              value + '</button>';
          }).join('') + '</div></div>';
      }).join('') + '</div>';
    }

    function questionBody() {
      if (state.current === 0) {
        return '<div class="choices">' +
          choiceButton('two-processes', '生产者、消费者两类，各自写一个循环函数', '每一类进程对应一个函数，函数内部再写重复执行的动作。') +
          choiceButton('single-function', '把所有动作写进一个进程函数', '') +
          choiceButton('slot-process', '缓冲区有几个格子，就写几个进程函数', '') +
          '</div>';
      }
      if (state.current === 1) return orderView();
      if (state.current === 2) {
        return '<div class="choices">' +
          choiceButton('consumer-sequence', 'P(full) → P(mutex) → 取出缓冲区 → V(mutex) → V(empty)', '先确认有产品，再保护取出动作；取走后释放锁并归还空位。') +
          choiceButton('consumer-reversed', 'P(mutex) → P(full) → 取出缓冲区 → V(empty) → V(mutex)', '先拿锁再等待产品，最后先归还空位。') +
          choiceButton('consumer-v-first', 'V(full) → P(mutex) → 取出缓冲区 → P(empty)', '把通知操作放在了取出之前。') +
          '</div>';
      }
      if (state.current === 3) return valuesView();
      if (state.current === 4) {
        return '<div class="choices">' +
          choiceButton('deadlock', '可能死锁：生产者占着 mutex 等空位，消费者拿不到 mutex 去取产品', '缓冲区已满，消费者本来可以取产品腾空位，却被生产者占有的互斥锁挡住。') +
          choiceButton('slow-only', '只是变慢，消费者最后一定能取走产品', '') +
          choiceButton('no-risk', '不会死锁，因为 mutex 的初值是 1', '') +
          '</div>';
      }
      return '<div class="choices">' +
        choiceButton('full-solution', '按进程分函数；资源 P 在 mutex P 前；临界区后 V(mutex)，再通知资源变化；初值 empty=N、full=0、mutex=1', '每一处都能对应到题目资源，并避免持锁等待另一个资源。') +
        choiceButton('wrong-order', '所有操作先 P(mutex)，等资源后再修改缓冲区；初值 mutex=0、empty=0、full=N', '') +
        choiceButton('missing-signal', '消费者取完产品后只 V(mutex)，不必 V(empty)', '') +
        '</div>';
    }

    function checklist() {
      return '<section class="panel side-panel"><div class="side-title">六步解题卡<span class="side-note">照这个顺序写</span></div><ol class="checklist">' +
        STEP_LABELS.map(function(label, index) {
          const done = state.cleared.includes(index);
          const active = state.current === index;
          return '<li class="check-item' + (active ? ' current' : '') + (done ? ' done' : '') + '">' +
            '<span class="check-num">' + (done ? '✓' : index + 1) + '</span><span>' + label + '</span>' +
            (active ? '<span class="current-tag">当前</span>' : '') + '</li>';
        }).join('') + '</ol></section>';
    }

    function sideNotes() {
      return '<section class="panel side-panel"><div class="side-title">记住这三个信号量</div><div class="sem-list">' +
        '<p><code>empty</code>：还有多少空位，用 <code>P(empty)</code> 申请。</p>' +
        '<p><code>full</code>：已有多少产品，用 <code>P(full)</code> 申请。</p>' +
        '<p><code>mutex</code>：保护共享缓冲区，初值通常是 <code>1</code>。</p>' +
        '</div></section><section class="panel side-panel deadlock-card"><div class="side-title">一眼查死锁</div>' +
        '<p>看每个 P 是否可能阻塞。如果进程已经拿着 mutex，又去等 empty 或 full，就要继续检查另一个进程能不能进入临界区释放资源。</p></section>';
    }

    function canSubmit() {
      if (state.current === 1) return state.order.length === PRODUCER_ANSWER.length;
      if (state.current === 3) return Boolean(state.values.empty && state.values.full && state.values.mutex);
      return Boolean(state.choice);
    }

    function renderGame() {
      const progress = (state.cleared.length / STEP_LABELS.length) * 100;
      const passed = state.cleared.includes(state.current);
      const body = questionBody();
      const feedback = state.feedback
        ? '<div class="feedback ' + (state.feedback.correct ? 'good' : 'try') + '" role="status">' +
          '<span class="feedback-mark">' + (state.feedback.correct ? '✓' : '↻') + '</span><span>' +
          state.feedback.text + '</span></div>'
        : '';
      const mainButton = state.feedback && state.feedback.correct
        ? '<button type="button" class="btn btn-primary" data-next>' +
          (state.current === STEP_LABELS.length - 1 ? '完成训练' : '下一步') + ' <span aria-hidden="true">→</span></button>'
        : '<button type="button" class="btn btn-primary" data-submit ' +
          (canSubmit() ? '' : 'disabled') + '>检查答案 <span aria-hidden="true">→</span></button>';

      app.innerHTML =
        '<section class="hero"><div><p class="eyebrow"><span class="eyebrow-dot"></span>操作系统 · 408 练习场</p>' +
        '<h1>信号量解题闯关</h1><p class="hero-copy">按你笔记里的六步法练：进程、动作、P/V、初值、等待和死锁，一步一步拆开。</p></div>' +
        scoreCard() + '</section>' +
        '<div class="progress-wrap"><div class="progress-meta"><span>第 ' + (state.current + 1) + ' / 6 关</span>' +
        '<span>' + state.cleared.length + ' 关已通过</span></div><div class="progress-track" role="progressbar" aria-label="闯关进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="' + state.cleared.length + '">' +
        '<div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
        '<div class="layout"><section class="panel challenge"><div class="challenge-head"><div>' +
        '<p class="step-kicker">第 ' + (state.current + 1) + ' 步 · ' + STEP_LABELS[state.current] + '</p>' +
        '<h2>' + QUESTION_TITLES[state.current] + '</h2></div>' +
        (passed ? '<span class="passed-pill">✓ 已通过</span>' : '') + '</div>' +
        '<div class="scenario">' + SCENARIOS[state.current] + '</div>' + body + feedback +
        '<div class="actions"><button type="button" class="btn" data-restart>↺ 重来</button>' + mainButton + '</div></section>' +
        '<aside class="side">' + checklist() + sideNotes() + '</aside></div>';
      bindEvents();
    }

    function renderComplete() {
      app.innerHTML =
        '<section class="panel complete"><div class="trophy" aria-hidden="true">★</div>' +
        '<p class="eyebrow"><span class="eyebrow-dot"></span>训练完成</p>' +
        '<h1>这题的 PV 思路，你已经走通了。</h1>' +
        '<p class="complete-copy">下次遇到同步互斥大题，先分进程，再逐个写动作和 PV，最后定初值、查等待和死锁。顺序清楚了，信号量就不容易乱。</p>' +
        '<div class="code-grid"><article class="code-card"><div class="code-label">生产者</div><pre><code>' +
        'while (1) {\\n  produce();\\n  P(empty); P(mutex);\\n  put();\\n  V(mutex); V(full);\\n}' +
        '</code></pre></article><article class="code-card"><div class="code-label">消费者</div><pre><code>' +
        'while (1) {\\n  P(full); P(mutex);\\n  get();\\n  V(mutex); V(empty);\\n  consume();\\n}' +
        '</code></pre></article></div>' +
        '<div class="initials"><strong>初值：</strong><code>mutex=1</code><code>empty=N</code><code>full=0</code></div>' +
        '<div class="complete-actions"><button type="button" class="btn btn-primary" data-restart>↺ 再闯一轮</button>' +
        '<button type="button" class="btn" data-back>回看最后一关</button><span class="path-summary">六步：分进程 → 排动作 → 检查 PV → 定初值 → 查死锁 → 综合自检</span></div>' +
        '<p class="path-summary" style="margin-top:22px">本轮得分：' + state.score + ' / 60</p></section>';
      bindEvents();
    }

    function grade(correct, success, hint) {
      if (correct) {
        state.feedback = { correct: true, text: success };
        if (!state.cleared.includes(state.current)) {
          state.cleared.push(state.current);
          state.score += 10;
        }
      } else {
        state.feedback = { correct: false, text: hint };
      }
      render();
    }

    function submit() {
      if (state.current === 0) {
        grade(
          state.choice === 'two-processes',
          '答对了。题目有几类进程，就按类别分别写函数；这个经典题有生产者和消费者两类。',
          '先数“谁在执行”：负责放入产品的是生产者，负责取走产品的是消费者，通常各写一个循环函数。'
        );
      } else if (state.current === 1) {
        const correct = state.order.length === PRODUCER_ANSWER.length &&
          state.order.every(function(action, index) { return action === PRODUCER_ANSWER[index]; });
        grade(
          correct,
          '顺序正确。先等空位，再申请互斥锁；写入后先释放锁，最后通知消费者有新产品。',
          '关键是先 P(empty)，再 P(mutex)。写完缓冲区后先 V(mutex)，再 V(full)。'
        );
      } else if (state.current === 2) {
        grade(
          state.choice === 'consumer-sequence',
          '正确。消费者先申请已有产品，再进入临界区；取走后释放互斥锁，并归还一个空位。',
          '消费者要先确认 full 大于 0，再申请 mutex；取出后执行 V(mutex) 和 V(empty)。'
        );
      } else if (state.current === 3) {
        grade(
          state.values.empty === 'N' && state.values.full === '0' && state.values.mutex === '1',
          '三种初值都对：empty=N、full=0、mutex=1。先把 PV 写清楚，再根据资源含义定初值。',
          '缓冲区起初有 N 个空位、0 个产品；互斥锁起初可用，所以 mutex 初值是 1。'
        );
      } else if (state.current === 4) {
        grade(
          state.choice === 'deadlock',
          '抓到死锁了。生产者持有 mutex 等 empty，消费者又必须拿 mutex 才能取出产品，双方互相卡住。',
          '想象缓冲区已经满了：生产者若先拿 mutex 再等 empty，就可能占着锁不放；消费者进不了临界区，也就无法腾出空位。'
        );
      } else {
        grade(
          state.choice === 'full-solution',
          '综合判断正确。把进程、动作、PV、初值和等待关系连起来检查，才算完整。',
          '核对五件事：进程分类正确；资源 P 在 mutex P 前；临界区由 mutex 保护；V 释放锁并通知资源变化；初值与题意一致。'
        );
      }
    }

    function bindEvents() {
      app.querySelectorAll('[data-choice]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (state.feedback && state.feedback.correct) return;
          state.choice = button.getAttribute('data-choice');
          state.feedback = null;
          render();
        });
      });
      app.querySelectorAll('[data-action]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (state.feedback && state.feedback.correct) return;
          const action = button.getAttribute('data-action');
          if (!state.order.includes(action)) state.order.push(action);
          state.feedback = null;
          render();
        });
      });
      app.querySelectorAll('[data-remove]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (state.feedback && state.feedback.correct) return;
          state.order.splice(Number(button.getAttribute('data-remove')), 1);
          state.feedback = null;
          render();
        });
      });
      app.querySelectorAll('[data-value-key]').forEach(function(button) {
        button.addEventListener('click', function() {
          if (state.feedback && state.feedback.correct) return;
          const key = button.getAttribute('data-value-key');
          const value = button.getAttribute('data-value');
          state.values[key] = value;
          state.feedback = null;
          render();
        });
      });
      const submitButton = app.querySelector('[data-submit]');
      if (submitButton) submitButton.addEventListener('click', submit);
      const nextButton = app.querySelector('[data-next]');
      if (nextButton) nextButton.addEventListener('click', function() {
        state.current += 1;
        state.choice = '';
        state.order = [];
        state.values = { empty: '', full: '', mutex: '' };
        state.feedback = null;
        render();
      });
      app.querySelectorAll('[data-restart]').forEach(function(button) {
        button.addEventListener('click', function() {
          state.current = 0;
          state.choice = '';
          state.order = [];
          state.values = { empty: '', full: '', mutex: '' };
          state.feedback = null;
          state.cleared = [];
          state.score = 0;
          render();
        });
      });
      const backButton = app.querySelector('[data-back]');
      if (backButton) backButton.addEventListener('click', function() {
        state.current = STEP_LABELS.length - 1;
        render();
      });
    }

    function render() {
      if (state.current >= STEP_LABELS.length) renderComplete();
      else renderGame();
    }

    render();
  </script>
</body>
</html>
