<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a2023">
  <title>青岚山水行记｜信号量修炼场</title>
  <style>
    :root {
      color-scheme: dark;
      --ink:#07191d; --ink2:#0b2528; --pine:#123a36; --pine2:#1d524a;
      --river:#183d50; --river2:#23566a; --jade:#72c9b0; --jade2:#a8e2cf;
      --blue:#83bdca; --mist:#cadbd3; --paper:#eee2c6; --gold:#e8bd78;
      --text:#edf4ee; --muted:#9db5ad; --line:rgba(188,222,209,.15);
      --panel:rgba(12,35,37,.84); --panel2:rgba(17,48,49,.78);
      --good:#85d8ad; --bad:#f19a91;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; min-height:100vh; color:var(--text);
      background:
        radial-gradient(ellipse at 12% 0%,rgba(43,103,82,.28),transparent 38rem),
        radial-gradient(ellipse at 91% 24%,rgba(38,99,123,.2),transparent 36rem),
        linear-gradient(155deg,#07191d 0%,#0a2025 48%,#0a1c21 100%);
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    button{font:inherit}
    button:focus-visible,a:focus-visible{outline:3px solid rgba(114,201,176,.65);outline-offset:3px}
    .shell{width:min(1240px,calc(100% - 36px));margin:auto;padding:20px 0 42px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:12px;min-width:max-content;color:var(--text);text-decoration:none;font-weight:800;letter-spacing:.03em}
    .brand-mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(114,201,176,.42);border-radius:15px;background:linear-gradient(145deg,rgba(114,201,176,.2),rgba(35,86,106,.24));color:var(--jade2);box-shadow:0 8px 30px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.12);font:800 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
    .brand small{display:block;margin-top:3px;color:#89aaa0;font-size:9px;font-weight:600;letter-spacing:.18em}
    .nav{display:flex;align-items:center;gap:5px;padding:5px;border:1px solid var(--line);border-radius:15px;background:rgba(3,18,22,.46);box-shadow:inset 0 1px rgba(255,255,255,.035)}
    .nav-link{border:1px solid transparent;border-radius:10px;padding:9px 12px;background:transparent;color:#a8bbb4;font-size:12px;font-weight:700;cursor:pointer;transition:.18s ease}
    .nav-link:hover{color:white;background:rgba(255,255,255,.05)}
    .nav-link.active{border-color:rgba(114,201,176,.22);background:linear-gradient(135deg,rgba(114,201,176,.16),rgba(35,86,106,.16));color:#c3efdd;box-shadow:0 5px 16px rgba(0,0,0,.16)}
    .profile{display:flex;align-items:center;gap:9px;min-width:max-content;color:#a9c2b9;font-size:11px}
    .profile-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid rgba(131,189,202,.35);background:rgba(35,86,106,.28);color:var(--blue);font-weight:800}
    .page{animation:fadein .28s ease}
    @keyframes fadein{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .panel{border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,rgba(20,55,51,.82),rgba(11,34,39,.91));box-shadow:0 22px 58px rgba(0,0,0,.24),inset 0 1px rgba(229,248,235,.055);backdrop-filter:blur(16px)}
    .hero{position:relative;isolation:isolate;overflow:hidden;min-height:290px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:clamp(24px,5vw,52px);border:1px solid rgba(147,210,184,.19);border-radius:29px;background:linear-gradient(112deg,rgba(9,35,34,.96) 4%,rgba(14,53,52,.86) 56%,rgba(19,58,69,.66));box-shadow:0 28px 80px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.1)}
    .hero-copy{position:relative;z-index:2;max-width:640px}
    .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:var(--jade);font-size:10px;font-weight:850;letter-spacing:.2em}
    .eyebrow-mark{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 14px rgba(114,201,176,.8)}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:12px;color:#f0f5e9;font-size:clamp(31px,5.3vw,55px);line-height:1.08;letter-spacing:-.045em;text-shadow:0 3px 25px rgba(0,0,0,.25)}
    .hero p{max-width:570px;margin-bottom:23px;color:#bdd0c6;font-size:14px;line-height:1.9}
    .hero-art{position:absolute;z-index:1;inset:0 0 0 auto;width:min(68%,760px);height:100%;opacity:.88;pointer-events:none;mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 18%,black 55%)}
    .hero-art svg{width:100%;height:100%}
    .hero-stats{position:relative;z-index:2;display:grid;gap:10px;min-width:166px}
    .hero-stat{padding:12px 15px;border:1px solid rgba(200,228,208,.14);border-radius:15px;background:rgba(5,24,28,.55);box-shadow:0 12px 24px rgba(0,0,0,.12);backdrop-filter:blur(7px)}
    .hero-stat span{display:block;color:#90aaa1;font-size:10px}
    .hero-stat strong{display:block;margin-top:3px;color:#e5f3e9;font-size:18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:0 16px;border:1px solid rgba(190,223,208,.18);border-radius:12px;background:rgba(8,25,30,.38);color:#c9d9d0;font-size:12px;font-weight:750;text-decoration:none;cursor:pointer;transition:.18s ease}
    .btn:hover{transform:translateY(-1px);border-color:rgba(192,229,211,.4);background:rgba(255,255,255,.06);color:white}
    .btn-main{border-color:rgba(201,228,183,.28);background:linear-gradient(115deg,#83c7a5,#acd8ba);color:#102a28;box-shadow:0 8px 24px rgba(48,119,83,.2)}
    .btn-main:hover{border-color:#c7e7c6;background:linear-gradient(115deg,#98d6b5,#c0e6c4);color:#0d2523}
    .btn:disabled{transform:none;cursor:not-allowed;border-color:var(--line);background:rgba(255,255,255,.035);color:#60736e;box-shadow:none}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:30px 2px 15px}
    .section-head h2{margin:0;color:#e4eee7;font-size:18px;letter-spacing:-.02em}
    .section-head p{margin:5px 0 0;color:#8fa9a0;font-size:11px;line-height:1.6}
    .section-link{border:0;background:none;color:var(--jade);font-size:11px;font-weight:800;cursor:pointer}
    .section-link:hover{color:#c0f1dd}
    .map-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative}
    .stage-card{position:relative;min-height:129px;overflow:hidden;padding:17px 17px 15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(21,59,53,.8),rgba(12,37,43,.92));color:var(--text);text-align:left;cursor:pointer;box-shadow:0 12px 24px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.045);transition:.2s ease}
    .stage-card:hover{transform:translateY(-3px);border-color:rgba(114,201,176,.35);box-shadow:0 19px 32px rgba(0,0,0,.23)}
    .stage-card::after{content:"";position:absolute;right:-30px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(72,160,133,.14),transparent 70%);pointer-events:none}
    .stage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .stage-no{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;background:rgba(114,201,176,.12);color:var(--jade2);font-size:11px;font-weight:850}
    .stage-state{color:#77958b;font-size:9px;font-weight:750}
    .stage-card.done .stage-state{color:var(--good)}
    .stage-card h3{margin:0 0 5px;color:#e2eee6;font-size:14px}
    .stage-card p{margin:0;color:#90aaa0;font-size:10px;line-height:1.6}
    .mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .mode-card{position:relative;min-height:150px;padding:19px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(140deg,rgba(20,61,56,.76),rgba(13,39,49,.84));box-shadow:0 14px 28px rgba(0,0,0,.18);transition:.2s ease}
    .mode-card:hover{transform:translateY(-2px);border-color:rgba(131,189,202,.3)}
    .mode-symbol{display:grid;place-items:center;width:37px;height:37px;margin-bottom:13px;border:1px solid rgba(131,189,202,.2);border-radius:12px;background:rgba(35,86,106,.2);color:var(--blue);font-size:16px}
    .mode-card h3{margin-bottom:5px;color:#e5eee7;font-size:14px}
    .mode-card p{margin:0 0 13px;color:#92aaa1;font-size:10px;line-height:1.7}
    .mode-card button{padding:0;border:0;background:none;color:var(--jade);font-size:10px;font-weight:800;cursor:pointer}
    .mode-card button:hover{color:#c4f0dc}
    .source-panel{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:17px;padding:15px 18px;border:1px solid rgba(201,222,199,.11);border-radius:15px;background:rgba(3,20,25,.4)}
    .source-panel strong{display:block;margin-bottom:4px;color:#d7e6db;font-size:11px}
    .source-panel p{margin:0;color:#8fa69f;font-size:10px;line-height:1.7}
    .source-links{display:flex;flex-wrap:wrap;gap:8px}
    a.source{color:#a9d9ca;font-size:10px;text-decoration:none;border-bottom:1px dotted rgba(169,217,202,.48)}
    a.source:hover{color:#e1f3e9}
    .page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:12px 2px 20px}
    .page-head h1{margin:0;font-size:clamp(25px,4vw,37px)}
    .page-head p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
    .xp-pill{padding:9px 13px;border:1px solid rgba(114,201,176,.19);border-radius:99px;background:rgba(114,201,176,.08);color:#b8e7d1;font-size:11px;font-weight:800;white-space:nowrap}
    .game-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.6fr);gap:16px;align-items:start}
    .play-panel{padding:clamp(19px,3vw,29px)}
    .play-head{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:15px}
    .step-kicker{margin:0 0 7px;color:var(--jade);font-size:10px;font-weight:850;letter-spacing:.1em}
    .play-head h2{margin:0;color:#eef4eb;font-size:clamp(19px,2.5vw,25px);line-height:1.42}
    .tag{padding:6px 9px;border:1px solid rgba(131,189,202,.2);border-radius:99px;background:rgba(35,86,106,.17);color:#a7d0d4;font-size:9px;font-weight:750;white-space:nowrap}
    .scenario{margin-bottom:18px;padding:13px 15px;border:1px solid rgba(114,201,176,.12);border-radius:13px;background:rgba(4,22,27,.4);color:#bbcec4;font-size:12px;line-height:1.8}
    .options{display:grid;gap:9px}
    .option{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(4,18,23,.32);color:#e3eee7;text-align:left;cursor:pointer;transition:.18s ease}
    .option:hover{transform:translateY(-1px);border-color:rgba(190,221,205,.3);background:rgba(255,255,255,.04)}
    .option.selected{border-color:rgba(114,201,176,.55);background:linear-gradient(110deg,rgba(63,133,100,.18),rgba(37,93,112,.16));box-shadow:0 0 0 2px rgba(114,201,176,.05)}
    .option:disabled{cursor:default}
    .option strong{display:block;font-size:12px;line-height:1.65}
    .option small{display:block;margin-top:4px;color:#94aaa1;font-size:10px;line-height:1.65}
    .sequence-box{display:flex;min-height:60px;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0 14px;padding:10px;border:1px dashed rgba(184,215,200,.22);border-radius:13px;background:rgba(3,15,19,.32)}
    .seq-empty{color:#718a82;font-size:10px}
    .sequence-chip{padding:8px 10px;border:1px solid rgba(114,201,176,.22);border-radius:9px;background:rgba(114,201,176,.08);color:#c8efdc;font-size:10px;cursor:pointer}
    .sequence-chip b{margin-right:6px;color:var(--jade)}
    .action-bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}
    .action-btn{min-height:41px;padding:9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:#cbdad2;font-size:10px;font-weight:750;cursor:pointer}
    .action-btn:hover{border-color:rgba(114,201,176,.34);background:rgba(114,201,176,.07)}
    .value-list{display:grid;gap:9px}
    .value-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(4,18,23,.28)}
    .value-label{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .value-label code{color:#c7ecce;font-weight:850}
    .value-label span{color:#8ea79d;font-size:10px}
    .value-options{display:flex;gap:6px}
    .value-btn{min-width:42px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.025);color:#c3d0c9;font:750 10px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
    .value-btn.selected{border-color:rgba(114,201,176,.55);background:rgba(114,201,176,.12);color:#cef1dd}
    .feedback{display:flex;gap:10px;margin-top:16px;padding:13px 14px;border:1px solid;border-radius:13px;font-size:11px;line-height:1.75}
    .feedback.good{border-color:rgba(133,216,173,.24);background:rgba(79,155,111,.1);color:#caefda}
    .feedback.bad{border-color:rgba(241,154,145,.22);background:rgba(140,65,66,.11);color:#f3cfca}
    .feedback-mark{flex:0 0 auto;font-weight:900}
    .play-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}
    .side-stack{display:grid;gap:12px}
    .side-panel{padding:17px}
    .side-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:#e0ece4;font-size:12px;font-weight:850}
    .side-muted{color:#78948a;font-size:9px;font-weight:550}
    .steps-list{display:grid;gap:5px;margin:0;padding:0;list-style:none}
    .steps-list li{display:flex;align-items:center;gap:9px;min-height:36px;padding:6px 8px;border:1px solid transparent;border-radius:10px;color:#78938a;font-size:10px}
    .steps-list li.active{border-color:rgba(114,201,176,.2);background:rgba(114,201,176,.07);color:#c7efdc}
    .steps-list li.done{color:#9adbb7}
    .step-dot{display:grid;place-items:center;width:22px;height:22px;flex:0 0 auto;border-radius:7px;background:rgba(255,255,255,.05);font-size:9px;font-weight:850}
    .steps-list li.done .step-dot{background:rgba(133,216,173,.12);color:var(--good)}
    .now-tag{margin-left:auto;color:var(--jade);font-size:8px;font-weight:850;letter-spacing:.1em}
    .sem-notes{display:grid;gap:9px;color:#9bb0a8;font-size:10px;line-height:1.75}
    .sem-notes p{margin:0}
    .sem-notes code{color:#c7eccd;font-weight:800}
    .tip-panel{border-color:rgba(131,189,202,.15);background:linear-gradient(150deg,rgba(22,70,75,.54),rgba(11,34,39,.9))}
    .tip-panel p{margin:0;color:#a9c0ba;font-size:10px;line-height:1.8}
    .exam-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:15px;align-items:start}
    .exam-nav{display:grid;gap:9px;padding:12px}
    .exam-case{padding:15px;border:1px solid transparent;border-radius:15px;background:rgba(3,18,22,.35);color:var(--text);text-align:left;cursor:pointer;transition:.18s ease}
    .exam-case:hover{border-color:rgba(131,189,202,.2)}
    .exam-case.active{border-color:rgba(114,201,176,.3);background:linear-gradient(125deg,rgba(114,201,176,.1),rgba(35,86,106,.12))}
    .exam-year{display:block;margin-bottom:6px;color:var(--jade);font-size:9px;font-weight:850;letter-spacing:.1em}
    .exam-case strong{display:block;margin-bottom:5px;font-size:12px}
    .exam-case small{color:#8ea79e;font-size:9px;line-height:1.6}
    .exam-work{padding:clamp(18px,3vw,27px)}
    .exam-progress{margin:0 0 18px;color:#8ea89e;font-size:10px}
    .exam-credit{margin-top:18px;padding:12px 14px;border:1px solid rgba(232,189,120,.16);border-radius:12px;background:rgba(113,84,40,.09);color:#c5b89a;font-size:10px;line-height:1.8}
    .source-inline{color:#b2dfd0}
    .sim-layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);gap:15px;align-items:start}
    .sim-panel{padding:19px}
    .sim-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 16px}
    .seg-btn{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:#a9bdb4;font-size:10px;font-weight:750;cursor:pointer}
    .seg-btn.active{border-color:rgba(114,201,176,.4);background:rgba(114,201,176,.1);color:#c8efdc}
    .buffer-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
    .buffer-slot{display:grid;place-items:center;min-height:67px;border:1px dashed rgba(176,209,193,.23);border-radius:13px;background:rgba(3,16,20,.35);color:#627b73;font-size:10px}
    .buffer-slot.filled{border-style:solid;border-color:rgba(131,189,202,.35);background:linear-gradient(140deg,rgba(35,86,106,.25),rgba(114,201,176,.1));color:#c6e8df;box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.14)}
    .sem-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .sem-token{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(3,17,22,.34);text-align:center}
    .sem-token code{display:block;margin-bottom:4px;color:#9cdbcb;font-size:10px;font-weight:800}
    .sem-token strong{font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;color:#edf4ee}
    .process-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .process-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(3,18,22,.34)}
    .process-card.blocked{border-color:rgba(241,154,145,.3);background:rgba(110,46,48,.12)}
    .process-card h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;color:#e0ece4;font-size:11px}
    .proc-status{color:#91b7a5;font-size:9px}
    .process-card.blocked .proc-status{color:#f0a29c}
    .next-op{margin-bottom:9px;color:#9ab0a5;font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
    .process-card .btn{width:100%;min-height:37px;font-size:10px}
    .trace{display:grid;gap:6px;max-height:260px;overflow:auto;margin:0;padding:0;list-style:none}
    .trace li{padding:8px 10px;border-left:2px solid rgba(114,201,176,.4);border-radius:0 9px 9px 0;background:rgba(2,14,18,.36);color:#9eb5ac;font-size:9px;line-height:1.55}
    .deadlock-banner{margin-top:12px;padding:12px 13px;border:1px solid rgba(241,154,145,.3);border-radius:12px;background:rgba(128,57,59,.13);color:#f1c0bc;font-size:11px;line-height:1.7}
    .practice-card{max-width:880px;margin:auto;padding:clamp(20px,4vw,34px)}
    .round-pips{display:flex;gap:6px;margin:0 0 17px}
    .round-pips span{width:28px;height:5px;border-radius:99px;background:rgba(255,255,255,.09)}
    .round-pips span.active{background:var(--jade);box-shadow:0 0 12px rgba(114,201,176,.3)}
    .review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .mistake-card{padding:15px;border:1px solid rgba(241,154,145,.16);border-radius:14px;background:rgba(85,47,48,.12)}
    .mistake-card strong{display:block;margin-bottom:6px;color:#eed8d1;font-size:11px}
    .mistake-card p{margin:0;color:#b7a39e;font-size:10px;line-height:1.7}
    .empty-state{padding:38px 20px;text-align:center}
    .empty-mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 14px;border:1px solid rgba(114,201,176,.19);border-radius:18px;background:rgba(114,201,176,.08);color:var(--jade);font-size:21px}
    .empty-state h2{margin-bottom:7px;color:#e3eee6;font-size:16px}
    .empty-state p{margin:0 auto 17px;max-width:420px;color:#91a99f;font-size:11px;line-height:1.8}
    .complete-card{padding:clamp(23px,4vw,40px)}
    .complete-mark{display:grid;place-items:center;width:58px;height:58px;margin-bottom:19px;border:1px solid rgba(232,189,120,.27);border-radius:18px;background:rgba(232,189,120,.1);color:var(--gold);font-size:25px}
    .code-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 0}
    .code-card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(2,14,18,.38)}
    .code-label{padding:10px 13px;border-bottom:1px solid var(--line);color:#a6d6c3;font-size:10px;font-weight:850}
    pre{overflow:auto;margin:0;padding:13px;color:#d2e5d9;font:10px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .end-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}
    .foot{margin:21px 0 0;color:#708880;font-size:9px;line-height:1.7;text-align:center}
    @media(max-width:960px){
      .topbar{flex-wrap:wrap}
      .nav{order:3;width:100%;overflow-x:auto;justify-content:flex-start}
      .nav-link{white-space:nowrap}
      .hero-stats{min-width:140px}
      .exam-grid{grid-template-columns:205px minmax(0,1fr)}
    }
    @media(max-width:760px){
      .shell{width:min(100% - 24px,620px);padding-top:13px}
      .hero{align-items:start;flex-direction:column;min-height:380px}
      .hero-art{inset:auto 0 0;width:100%;height:62%;mask-image:linear-gradient(0deg,black 0%,rgba(0,0,0,.7) 55%,transparent 100%)}
      .hero-stats{display:flex;flex-wrap:wrap}
      .hero-stat{min-width:125px}
      .map-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .mode-grid{grid-template-columns:1fr}
      .mode-card{min-height:130px}
      .game-layout,.sim-layout{grid-template-columns:1fr}
      .side-stack{grid-template-columns:1fr 1fr}
      .side-stack .side-panel:first-child{grid-column:span 2}
      .exam-grid{grid-template-columns:1fr}
      .exam-nav{grid-template-columns:1fr 1fr}
    }
    @media(max-width:520px){
      .profile-label{display:none}
      .hero{padding:23px 19px}
      .hero h1{font-size:35px}
      .map-grid{grid-template-columns:1fr 1fr;gap:8px}
      .stage-card{min-height:119px;padding:13px}
      .stage-card p{font-size:9px}
      .section-head{align-items:start;flex-direction:column}
      .source-panel{align-items:start;flex-direction:column}
      .side-stack{grid-template-columns:1fr}
      .side-stack .side-panel:first-child{grid-column:auto}
      .exam-nav{grid-template-columns:1fr}
      .play-actions{align-items:stretch}
      .play-actions .btn{flex:1}
      .value-row{align-items:start;flex-direction:column}
      .process-grid{grid-template-columns:1fr}
      .review-grid,.code-grid{grid-template-columns:1fr}
      .sem-row{gap:5px}
      .sem-token{padding:9px 5px}
      .sem-token strong{font-size:15px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" data-route="map">
        <span class="brand-mark">青岚</span>
        <span>信号量修炼场<small>OS · PV JOURNEY</small></span>
      </a>
      <nav class="nav" aria-label="训练模式">
        <button class="nav-link active" data-route="map">山水行记</button>
        <button class="nav-link" data-route="story">主线闯关</button>
        <button class="nav-link" data-route="exam">真题秘境</button>
        <button class="nav-link" data-route="sandbox">并发沙盘</button>
        <button class="nav-link" data-route="practice">随机试炼</button>
        <button class="nav-link" data-route="review">错题回看</button>
      </nav>
      <div class="profile"><span class="profile-mark">研</span><span class="profile-label">研习者 · <b id="rank-label">初入青岚</b></span></div>
    </header>
    <main id="app" class="page" aria-live="polite"></main>
    <p class="foot">山水有序，PV 有迹。答错不会扣分；每次解释清楚为什么，才算真正过关。</p>
  </div>
  <script>
    const STORE_KEY = 'qinglan-pv-journey-v1';
    const MAIN_STEPS = ['辨进程', '排动作', '写 P/V', '定初值', '查等待', '看死锁'];
    const MAIN_ACTIONS = ['P(empty)', 'P(mutex)', '放入缓冲区', 'V(mutex)', 'V(full)'];
    const MAIN_ANSWER = ['P(empty)', 'P(mutex)', '放入缓冲区', 'V(mutex)', 'V(full)'];
    const SOURCE_2014 = 'https://www.xit.edu.cn/_upload/article/files/c1/ce/26986f79493495bbaacba9738587/becf4a64-f52d-4e03-bf57-edd1e6d9bb11.pdf';
    const SOURCE_2024 = 'https://www.xit.edu.cn/_upload/article/files/c1/ce/26986f79493495bbaacba9738587/6b611f5c-55d9-4612-8ff9-30b028731314.pdf';

    function loadSave() {
      try {
        const value = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        return {
          xp: Number(value.xp) || 0,
          clearedMain: Array.isArray(value.clearedMain) ? value.clearedMain : [],
          completedTasks: Array.isArray(value.completedTasks) ? value.completedTasks : [],
          examCleared: Array.isArray(value.examCleared) ? value.examCleared : [],
          mistakes: Array.isArray(value.mistakes) ? value.mistakes : [],
          deadlockSolved: Boolean(value.deadlockSolved)
        };
      } catch (e) {
        return { xp: 0, clearedMain: [], completedTasks: [], examCleared: [], mistakes: [], deadlockSolved: false };
      }
    }

    const save = loadSave();
    let route = 'map';
    const main = { step: 0, choice: '', order: [], values: { empty: '', full: '', mutex: '' }, feedback: null };
    const exam = { year: '2014', step: 0, choice: '', values: {}, feedback: null };
    let practice = makePractice();
    let sim = makeSimulation(2, 'safe', []);

    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {}
      updateRank();
    }

    function updateRank() {
      const rank = save.xp >= 100 ? '山水通明' : save.xp >= 45 ? '掌灯行者' : '初入青岚';
      const el = document.getElementById('rank-label');
      if (el) el.textContent = rank;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function award(taskId, amount) {
      if (save.completedTasks.includes(taskId)) return false;
      save.completedTasks.push(taskId);
      save.xp += amount;
      persist();
      return true;
    }

    function addMistake(id, title, principle) {
      if (!save.mistakes.some(function(item) { return item.id === id; })) {
        save.mistakes.unshift({ id: id, title: title, principle: principle });
        save.mistakes = save.mistakes.slice(0, 30);
        persist();
      }
    }

    function iconButton(text, routeName) {
      return '<button class="btn" data-route="' + routeName + '">' + text + '</button>';
    }

    function renderMap() {
      const stages = [
        ['01', '先辨进程', '几类进程，就先分几条执行线。'],
        ['02', '动作排队', '把每类进程的动作写成自己的顺序。'],
        ['03', '补上 P/V', '资源先申请，动作完成后再释放或通知。'],
        ['04', '定义信号量', '先读懂含义，再填初值。'],
        ['05', '检查阻塞', '每个 P 都问一声：这里会不会等？'],
        ['06', '拆解死锁', '看谁拿着锁等资源，谁又等着拿锁。']
      ];
      const cards = stages.map(function(stage, index) {
        const done = save.clearedMain.includes(index);
        return '<button class="stage-card' + (done ? ' done' : '') + '" data-main-stage="' + index + '">' +
          '<div class="stage-top"><span class="stage-no">' + stage[0] + '</span><span class="stage-state">' +
          (done ? '✓ 已通关' : '进入关卡 →') + '</span></div><h3>' + stage[1] + '</h3><p>' + stage[2] + '</p></button>';
      }).join('');
      const percent = Math.round((save.clearedMain.length / 6) * 100);
      return '<section class="hero"><div class="hero-copy"><p class="eyebrow"><span class="eyebrow-mark"></span>操作系统 · 408 山水研习</p>' +
        '<h1>青岚山水行记</h1><p>把同步与互斥拆成一段段山路：先辨进程，再排动作、补 PV、看阻塞。闯关、真题变式和并发推演都在这张图里。</p>' +
        '<button class="btn btn-main" data-route="story">继续登阶 <span aria-hidden="true">↗</span></button> ' +
        '<button class="btn" data-route="exam">去真题秘境</button></div>' +
        '<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 900 440" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ac9b5" stop-opacity=".02"/><stop offset="1" stop-color="#8dc3ae" stop-opacity=".24"/></linearGradient><linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fd6c1" stop-opacity=".08"/><stop offset=".5" stop-color="#62b3ba" stop-opacity=".48"/><stop offset="1" stop-color="#4e92a5" stop-opacity=".18"/></linearGradient></defs>' +
        '<path d="M0 265 112 142l58 62L291 69l102 129L500 84l109 142 88-95 203 178v131H0Z" fill="#527c70" opacity=".31"/>' +
        '<path d="m0 310 139-117 83 65 139-156 99 126 103-94 95 113 87-68 155 103v158H0Z" fill="#29584f" opacity=".62"/>' +
        '<path d="m0 342 118-93 116 67 118-92 104 76 127-73 94 79 92-45 131 72v107H0Z" fill="#153b39" opacity=".89"/>' +
        '<path d="M496 185c-70 54-54 100 9 124 44 17 42 50-9 68-57 19-92 36-62 62 18 16 67 20 99 40" fill="none" stroke="url(#river)" stroke-width="47" stroke-linecap="round"/>' +
        '<path d="M491 183c-62 49-49 89 12 112 42 16 40 46-9 63-54 18-83 33-56 56" fill="none" stroke="#b2e3d1" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>' +
        '<path d="M0 270c138-33 209-19 329 4s208 12 306-12 177-25 265-2" fill="none" stroke="#d5e6d4" stroke-opacity=".12" stroke-width="2"/>' +
        '<circle cx="674" cy="92" r="42" fill="#c7d9b8" opacity=".09"/><circle cx="674" cy="92" r="26" fill="#d9e4c5" opacity=".13"/>' +
        '</svg></div><div class="hero-stats"><div class="hero-stat"><span>研习值</span><strong>' + save.xp + ' <small style="font-size:10px;color:#85a59a">XP</small></strong></div>' +
        '<div class="hero-stat"><span>主线进度</span><strong>' + percent + '%</strong></div><div class="hero-stat"><span>错题待回看</span><strong>' + save.mistakes.length + ' <small style="font-size:10px;color:#85a59a">条</small></strong></div></div></section>' +
        '<div class="section-head"><div><h2>沿山路逐步通关</h2><p>每一关只攻一个动作，走完六步再组合成完整解。</p></div><button class="section-link" data-route="story">进入主线 →</button></div>' +
        '<section class="map-grid">' + cards + '</section>' +
        '<div class="section-head"><div><h2>换一种练法</h2><p>题目、推演和随机变式轮着来，避免只背一套 PV。</p></div></div>' +
        '<section class="mode-grid">' +
        '<article class="mode-card"><div class="mode-symbol">卷</div><h3>真题秘境</h3><p>把 2014 多消费者批量取货、2024 单缓冲区操作改成可操作挑战。</p><button data-route="exam">选择真题原型 →</button></article>' +
        '<article class="mode-card"><div class="mode-symbol">演</div><h3>并发沙盘</h3><p>自己调度生产者和消费者，观察空位、产品、互斥锁怎么变化。</p><button data-route="sandbox">进入沙盘 →</button></article>' +
        '<article class="mode-card"><div class="mode-symbol">变</div><h3>随机试炼</h3><p>缓冲区容量、批量大小每轮变化，练会从题意重新定义信号量。</p><button data-route="practice">抽取变式 →</button></article></section>' +
        '<div class="section-head"><div><h2>本轮收获</h2><p>熟练度靠解释和复盘累积，不靠倒计时催促。</p></div><button class="section-link" data-route="review">打开错题回看 →</button></div>' +
        '<section class="panel" style="display:flex;flex-wrap:wrap;gap:10px;padding:15px">' +
        '<span class="tag">主线 ' + save.clearedMain.length + ' / 6</span><span class="tag">真题关 ' + save.examCleared.length + ' / 6</span>' +
        '<span class="tag">' + (save.deadlockSolved ? '✓ 已识别死锁' : '◇ 待破解：持锁等待') + '</span>' +
        '<span class="tag">称号：' + (save.xp >= 100 ? '山水通明' : save.xp >= 45 ? '掌灯行者' : '初入青岚') + '</span></section>' +
        '<section class="source-panel"><div><strong>题源与改编说明</strong><p>题型原型参考 2014 年 408 操作系统第 47 题、2024 年第 46 题；这里更换场景和参数，用互动练考点，不照搬整段题面。</p></div>' +
        '<div class="source-links"><a class="source" href="' + SOURCE_2014 + '" target="_blank" rel="noreferrer">2014 题本 PDF</a><a class="source" href="' + SOURCE_2024 + '" target="_blank" rel="noreferrer">2024 题本 PDF</a></div></section>';
    }

    function optionHTML(prefix, id, title, detail, selected, disabled) {
      return '<button class="option' + (selected ? ' selected' : '') + '" data-' + prefix + '-choice="' + escapeHTML(id) +
        '" aria-pressed="' + Boolean(selected) + '"' + (disabled ? ' disabled' : '') + '><strong>' + title +
        '</strong>' + (detail ? '<small>' + detail + '</small>' : '') + '</button>';
    }

    function valueRows(prefix, values, rows, options, disabled) {
      return '<div class="value-list">' + rows.map(function(row) {
        return '<div class="value-row"><div class="value-label"><code>' + row.label + '</code><span>' + row.meaning + '</span></div>' +
          '<div class="value-options">' + options.map(function(value) {
            const selected = values[row.key] === String(value);
            return '<button class="value-btn' + (selected ? ' selected' : '') + '" data-' + prefix +
              '-value-key="' + row.key + '" data-value="' + value + '" aria-pressed="' + selected + '"' +
              (disabled ? ' disabled' : '') + '>' + value + '</button>';
          }).join('') + '</div></div>';
      }).join('') + '</div>';
    }

    function feedbackHTML(feedback) {
      if (!feedback) return '';
      return '<div class="feedback ' + (feedback.good ? 'good' : 'bad') + '" role="status"><span class="feedback-mark">' +
        (feedback.good ? '✓' : '↻') + '</span><span>' + feedback.text + '</span></div>';
    }

    function mainQuestion() {
      if (main.step === 0) {
        return '<div class="options">' +
          optionHTML('main','roles','生产者、消费者两类，各写一个循环函数','题目有几类进程，先按类别分出执行线。',main.choice==='roles',main.feedback?.good) +
          optionHTML('main','one','把所有动作合在一个进程函数里','',main.choice==='one',main.feedback?.good) +
          optionHTML('main','slots','缓冲区每个格子各对应一个进程','',main.choice==='slots',main.feedback?.good) + '</div>';
      }
      if (main.step === 1) {
        const selected = main.order.length ? main.order.map(function(item,index) {
          return '<button class="sequence-chip" data-main-remove="' + index + '"><b>' + (index+1) + '.</b>' + escapeHTML(item) + '</button>';
        }).join('') : '<span class="seq-empty">按执行先后顺序点选动作</span>';
        const bank = MAIN_ACTIONS.filter(function(item) { return !main.order.includes(item); }).map(function(item) {
          return '<button class="action-btn" data-main-action="' + escapeHTML(item) + '">＋ ' + escapeHTML(item) + '</button>';
        }).join('');
        return '<p style="color:#9db5ad;font-size:10px;line-height:1.8">生产者已做好一个产品。排好它访问共享缓冲区时的动作；点错了可以点上方动作移除。</p>' +
          '<div class="sequence-box">' + selected + '</div><div class="action-bank">' + bank + '</div>';
      }
      if (main.step === 2) {
        return '<div class="options">' +
          optionHTML('main','consumer','P(full) → P(mutex) → 取出 → V(mutex) → V(empty)','先等产品，再进入临界区；取出后释放锁并归还空位。',main.choice==='consumer',main.feedback?.good) +
          optionHTML('main','reverse','P(mutex) → P(full) → 取出 → V(empty) → V(mutex)','先拿锁再等待产品，可能占锁阻止另一方改变资源。',main.choice==='reverse',main.feedback?.good) +
          optionHTML('main','notify','V(full) → 取出 → P(mutex) → V(empty)','',main.choice==='notify',main.feedback?.good) + '</div>';
      }
      if (main.step === 3) {
        return valueRows('main',main.values,[
          {key:'empty',label:'empty',meaning:'空位数量'},
          {key:'full',label:'full',meaning:'已有产品数量'},
          {key:'mutex',label:'mutex',meaning:'缓冲区互斥锁'}
        ],['N','0','1'],main.feedback?.good);
      }
      if (main.step === 4) {
        return '<div class="options">' +
          optionHTML('main','deadlock','会死锁：生产者持锁等空位，消费者要拿锁才能腾空位','缓冲区已满时，先拿 mutex 再等 empty 会卡住消费者。',main.choice==='deadlock',main.feedback?.good) +
          optionHTML('main','slow','只会变慢，消费者一定能继续','',main.choice==='slow',main.feedback?.good) +
          optionHTML('main','safe','不会出问题，因为 mutex 初值为 1','',main.choice==='safe',main.feedback?.good) + '</div>';
      }
      return '<div class="options">' +
        optionHTML('main','audit','资源 P 在 mutex P 前；临界区后释放 mutex，再通知资源变化；初值 empty=N、full=0、mutex=1','',main.choice==='audit',main.feedback?.good) +
        optionHTML('main','badorder','所有动作先 P(mutex)，拿锁后再等 empty/full','',main.choice==='badorder',main.feedback?.good) +
        optionHTML('main','missing','消费者取完只 V(mutex)，不需要 V(empty)','',main.choice==='missing',main.feedback?.good) + '</div>';
    }

    function resetMainAnswer() {
      main.choice = '';
      main.order = [];
      main.values = { empty: '', full: '', mutex: '' };
      main.feedback = null;
    }

    function mainReady() {
      if (main.step === 1) return main.order.length === MAIN_ANSWER.length;
      if (main.step === 3) return Boolean(main.values.empty && main.values.full && main.values.mutex);
      return Boolean(main.choice);
    }

    function checkMain() {
      let correct = false, text = '', hint = '', title = MAIN_STEPS[main.step];
      if (main.step === 0) {
        correct = main.choice === 'roles';
        text = '对。先把生产者和消费者分开写，每类进程各有自己的循环动作。';
        hint = '先数执行主体：一个负责放产品，一个负责取产品。题目有两类进程，就先列两条执行线。';
      } else if (main.step === 1) {
        correct = main.order.length === MAIN_ANSWER.length && main.order.every(function(item,index){return item===MAIN_ANSWER[index];});
        text = '顺序对了：先申请空位，再拿互斥锁；写入后先放锁，再发出“有产品”的通知。';
        hint = '生产者先 P(empty)，再 P(mutex)；写入后 V(mutex)，最后 V(full)。';
      } else if (main.step === 2) {
        correct = main.choice === 'consumer';
        text = '对。消费者先 P(full) 等产品，再用 mutex 保护取出动作；之后 V(mutex) 和 V(empty)。';
        hint = '消费者的资源条件是“必须有产品”，所以 P(full) 要在申请互斥锁之前。';
      } else if (main.step === 3) {
        correct = main.values.empty === 'N' && main.values.full === '0' && main.values.mutex === '1';
        text = '初值正确。空缓冲区有 N 个空位、0 个产品；互斥锁一开始可进入，所以 mutex=1。';
        hint = '从题目开局状态数：空位 N 个、产品 0 个；互斥信号量可用，初值 1。';
      } else if (main.step === 4) {
        correct = main.choice === 'deadlock';
        text = '会卡死。生产者拿着 mutex 等 empty；消费者无法进入缓冲区取产品，也就无法释放空位。';
        hint = '把缓冲区设成已满：哪一个进程占着 mutex？另一个进程能不能进去取产品并增加 empty？';
      } else {
        correct = main.choice === 'audit';
        text = '检查完整了。先等资源、再进临界区；出临界区后释放互斥锁，并正确通知对方资源变化。';
        hint = '逐项核对资源 P、mutex P、临界区、V 的释放顺序和三种信号量初值。';
      }
      if (correct) {
        if (!save.clearedMain.includes(main.step)) save.clearedMain.push(main.step);
        award('main-' + main.step, 10);
      } else {
        addMistake('main-' + main.step,title,hint);
      }
      main.feedback = { good: correct, text: correct ? text : hint };
      persist();
      render();
    }

    function mainComplete() {
      return '<section class="panel complete-card"><div class="complete-mark">✦</div><p class="eyebrow"><span class="eyebrow-mark"></span>主线已通关</p>' +
        '<h1 style="font-size:clamp(28px,4vw,43px)">你把六步法走成了一条完整路线。</h1>' +

            '<p style="color:#9db5ad;font-size:10px;line-height:1.8">给四个信号量配初值：empty 表示空位，full 表示货物；bufferLock 保护单次存取，batchLock 保证同一消费者取完整批。</p>' +

    function makeSimulation(capacity, mode, initial) {
      const buffer=initial.slice();
      return {
        capacity:capacity, mode:mode, buffer:buffer,
        sem:{empty:capacity-buffer.length,full:buffer.length,mutex:1},
        waiters:{empty:[],full:[],mutex:[]},
        proc:{
          producer:{pc:0,status:'ready',blockedOn:''},
          consumer:{pc:0,status:'ready',blockedOn:''}
        },
        log:['沙盘已就绪。选择一个进程，再执行它的下一条操作。']
      };
    }

    function simProgram(role) {
      if(role==='producer'){
        return sim.mode==='risk'
          ? ['P(mutex)','P(empty)','put','V(mutex)','V(full)']
          : ['P(empty)','P(mutex)','put','V(mutex)','V(full)'];
      }
      return ['P(full)','P(mutex)','get','V(mutex)','V(empty)'];
    }

    function opName(op) {
      const names={
        'P(empty)':'申请空位','P(full)':'等待产品','P(mutex)':'申请互斥锁',
        'V(empty)':'归还空位','V(full)':'通知有产品','V(mutex)':'释放互斥锁',
        'put':'放入一件产品','get':'取出一件产品'
      };
      return names[op]||op;
    }

    function logSim(message) {
      sim.log.unshift(message);
      sim.log=sim.log.slice(0,12);
    }

    function runSim(role) {
      const proc=sim.proc[role];
      if(proc.status==='blocked')return;
      const program=simProgram(role);
      const op=program[proc.pc];
      const prefix=role==='producer'?'生产者':'消费者';
      if(op.charAt(0)==='P'){
        const key=op.slice(2,-1);
        if(sim.sem[key]<=0){
          proc.status='blocked';
          proc.blockedOn=key;
          sim.waiters[key].push(role);
          logSim(prefix+'执行 '+op+'，资源不足，进入等待队列。');
        }else{
          sim.sem[key]-=1;
          proc.pc=(proc.pc+1)%program.length;
          logSim(prefix+'执行 '+op+' 成功，'+key+' 变为 '+sim.sem[key]+'。');
        }
      }else if(op.charAt(0)==='V'){
        const key=op.slice(2,-1);
        proc.pc=(proc.pc+1)%program.length;
        if(sim.waiters[key].length){
          const awakened=sim.waiters[key].shift();
          const waiting=sim.proc[awakened];
          waiting.status='ready'; waiting.blockedOn='';
          waiting.pc=(waiting.pc+1)%simProgram(awakened).length;
          logSim(prefix+'执行 '+op+'，直接唤醒等待 '+key+' 的'+(awakened==='producer'?'生产者':'消费者')+'。');
        }else{
          sim.sem[key]+=1;
          logSim(prefix+'执行 '+op+'，'+key+' 变为 '+sim.sem[key]+'。');
        }
      }else if(op==='put'){
        if(sim.buffer.length<sim.capacity){
          sim.buffer.push('货物 '+(Date.now()%10000));
          proc.pc=(proc.pc+1)%program.length;
          logSim('生产者放入一件货物，缓冲区 '+sim.buffer.length+' / '+sim.capacity+'。');
        }else logSim('缓冲区已满，放入动作无法继续；检查前面的 P(empty)。');
      }else if(op==='get'){
        if(sim.buffer.length){
          const item=sim.buffer.shift();
          proc.pc=(proc.pc+1)%program.length;
          logSim('消费者取走 '+item+'，缓冲区 '+sim.buffer.length+' / '+sim.capacity+'。');
        }else logSim('缓冲区为空，取出动作无法继续；检查前面的 P(full)。');
      }
      render();
    }

    function simDeadlocked() {
      return sim.proc.producer.status==='blocked'&&sim.proc.consumer.status==='blocked';
    }

    function processCard(role) {
      const proc=sim.proc[role],name=role==='producer'?'生产者':'消费者';
      const program=simProgram(role),op=program[proc.pc];
      const status=proc.status==='blocked'?'等待 '+proc.blockedOn:'可运行';
      return '<article class="process-card '+(proc.status==='blocked'?'blocked':'')+'"><h3>'+name+'<span class="proc-status">'+status+'</span></h3>' +
        '<div class="next-op">下一步：'+op+' · '+opName(op)+'</div><button class="btn" data-sim-step="'+role+'" '+(proc.status==='blocked'?'disabled':'')+'>执行一步 →</button></article>';
    }

    function renderSandbox() {
      const slots=Array.from({length:sim.capacity},function(_,index){
        const item=sim.buffer[index];
        return '<div class="buffer-slot '+(item?'filled':'')+'">'+(item?escapeHTML(item):'空缓冲位')+'</div>';
      }).join('');
      const trace=sim.log.map(function(line){return '<li>'+escapeHTML(line)+'</li>';}).join('');
      const dead=simDeadlocked();
      return '<div class="page-head"><div><p class="eyebrow"><span class="eyebrow-mark"></span>并发沙盘 · 手动调度</p><h1>亲手推演一次 P 和 V</h1><p>每点一次只运行一条操作。观察进程状态、缓冲区内容和信号量变化。</p></div><span class="xp-pill">不计时 · 可重置</span></div>' +
        '<div class="sim-layout"><section class="panel sim-panel"><div class="side-title">场景设置<span class="side-muted">先选调度，再点进程执行</span></div>' +
        '<div class="sim-toolbar"><button class="seg-btn '+(sim.mode==='safe'?'active':'')+'" data-sim-mode="safe">安全顺序</button><button class="seg-btn '+(sim.mode==='risk'?'active':'')+'" data-sim-mode="risk">危险顺序</button><button class="seg-btn" data-sim-demo>载入死锁演示</button><button class="seg-btn" data-sim-reset>重置</button></div>' +
        '<div class="sim-toolbar"><span class="side-muted" style="padding:0 3px">缓冲区容量</span>'+[1,2,3].map(function(n){return '<button class="seg-btn '+(sim.capacity===n?'active':'')+'" data-sim-cap="'+n+'">'+n+' 格</button>';}).join('')+'</div>' +
        '<div class="side-title" style="margin-top:18px">共享缓冲区 <span class="side-muted">'+sim.buffer.length+' / '+sim.capacity+' 件</span></div><div class="buffer-board">'+slots+'</div>' +
        '<div class="sem-row"><div class="sem-token"><code>empty</code><strong>'+sim.sem.empty+'</strong></div><div class="sem-token"><code>full</code><strong>'+sim.sem.full+'</strong></div><div class="sem-token"><code>mutex</code><strong>'+sim.sem.mutex+'</strong></div></div>' +
        '<div class="process-grid">'+processCard('producer')+processCard('consumer')+'</div>' +
        (dead?'<div class="deadlock-banner"><strong>死锁出现了。</strong>两个进程都在等待，没人能继续释放对方需要的资源。看生产者是否拿着 mutex 等 empty。</div>':'') +
        '</section><aside class="side-stack"><section class="panel side-panel"><div class="side-title">最近操作<span class="side-muted">新记录在上</span></div><ol class="trace">'+trace+'</ol></section>' +
        '<section class="panel side-panel tip-panel"><div class="side-title">观察重点</div><p>安全顺序先 P(empty) / P(full)，再 P(mutex)。危险顺序让生产者先拿 mutex 再等空位；缓冲区满时，它可能挡住消费者取货。</p></section>' +
        '<section class="panel side-panel"><div class="side-title">当前程序顺序</div><div class="sem-notes"><p><code>Producer:</code> '+(sim.mode==='risk'?'P(mutex) → P(empty)':'P(empty) → P(mutex)')+' → put → V(mutex) → V(full)</p><p><code>Consumer:</code> P(full) → P(mutex) → get → V(mutex) → V(empty)</p></div></section></aside></div>';
    }

    function makePractice() {
      const capacity=3+Math.floor(Math.random()*6);
      const batch=2+Math.floor(Math.random()*4);
      return {capacity:capacity,batch:batch,round:0,choice:'',values:{},feedback:null,id:'practice-'+Date.now()};
    }

    function renderPractice() {
      const ready=practice.round===0
        ? ['empty','full','mutex','batch'].every(function(key){return Boolean(practice.values[key]);})
        : Boolean(practice.choice);
      const question=practice.round===0
        ? '<div class="scenario">随机题：容量 '+practice.capacity+' 的补给仓开局为空；消费者每次连续拿 '+practice.batch+' 件，其他消费者不能插队。给 empty、full、mutex、batchLock 配初值。</div>' +
          valueRows('practice',practice.values,[
            {key:'empty',label:'empty',meaning:'空位数量'},
            {key:'full',label:'full',meaning:'产品数量'},
            {key:'mutex',label:'mutex',meaning:'单次存取互斥'},
            {key:'batch',label:'batchLock',meaning:'整批消费者互斥'}
          ],[0,1,practice.capacity,practice.batch],false)
        : '<div class="scenario">新一轮容量 '+practice.capacity+'，缓冲区可能已满。生产者申请资源和进入临界区，哪个次序更安全？</div><div class="options">' +
          optionHTML('practice','safe-order','P(empty) → P(mutex) → put → V(mutex) → V(full)','先申请资源位，再拿锁。',practice.choice==='safe-order',practice.feedback?.good) +
          optionHTML('practice','risky-order','P(mutex) → P(empty) → put → V(full) → V(mutex)','可能持锁等待资源，通知也放在释放锁之前。',practice.choice==='risky-order',practice.feedback?.good) +
          '</div>';
      const pips='<div class="round-pips"><span class="active"></span><span class="'+(practice.round===1?'active':'')+'"></span></div>';
      const action=practice.feedback&&practice.feedback.good
        ? '<button class="btn btn-main" data-practice-next>'+(practice.round===0?'下一段 →':'完成本轮 →')+'</button>'
        : '<button class="btn btn-main" data-practice-submit '+(ready?'':'disabled')+'>检查答案 →</button>';
      return '<div class="page-head"><div><p class="eyebrow"><span class="eyebrow-mark"></span>随机试炼 · 参数每轮变化</p><h1>别背答案，重新读题</h1><p>容量、连续取货数量都会变化，先从题意推信号量。</p></div><button class="btn" data-practice-new>抽一张新变式 ↻</button></div>' +
        '<section class="panel practice-card"><div class="side-title">变式 '+practice.capacity+' 格 · 连取 '+practice.batch+' 件<span class="side-muted">'+(practice.round===0?'1 / 2 · 初值配对':'2 / 2 · P 顺序诊断')+'</span></div>' +
        pips+question+feedbackHTML(practice.feedback)+'<div class="play-actions"><button class="btn" data-practice-new>换一张题</button>'+action+'</div></section>';
    }

    function checkPractice() {
      let correct=false,text='',hint='';
      if(practice.round===0){
        correct=practice.values.empty===String(practice.capacity)&&practice.values.full==='0'&&practice.values.mutex==='1'&&practice.values.batch==='1';
        text='对。空位数等于容量 '+practice.capacity+'，full=0；两类互斥锁初值都为 1。';
        hint='缓冲区开局为空：empty='+practice.capacity+'、full=0。mutex 和 batchLock 都表示可进入的互斥锁，初值为 1。';
      }else{
        correct=practice.choice==='safe-order';
        text='对。先申请空位，再进入互斥区。这个原则不随缓冲区容量变化。';
        hint='考虑缓冲区已满：如果先拿 mutex 再等待 empty，可能持锁阻止消费者进入。';
      }
      const id=practice.id+'-'+practice.round;
      if(correct)award(id,12);
      else addMistake(id,'随机试炼：'+(practice.round===0?'信号量初值':'P 操作顺序'),hint);
      practice.feedback={good:correct,text:correct?text:hint};
      persist(); render();
    }

    function renderReview() {
      if(!save.mistakes.length){
        return '<div class="page-head"><div><p class="eyebrow"><span class="eyebrow-mark"></span>错题回看 · 复盘记录</p><h1>把容易混的地方收起来</h1><p>练习时答错的知识点会自动记在这里。</p></div><span class="xp-pill">当前 0 条</span></div>' +
          '<section class="panel empty-state"><div class="empty-mark">✓</div><h2>错题本暂时空着</h2><p>可以去主线、真题或沙盘闯几关。答错后会记下具体知识点和下一次的检查方向。</p><button class="btn btn-main" data-route="exam">去真题秘境 →</button></section>';
      }
      const cards=save.mistakes.map(function(item){
        return '<article class="mistake-card"><strong>'+escapeHTML(item.title)+'</strong><p>'+escapeHTML(item.principle)+'</p></article>';
      }).join('');
      return '<div class="page-head"><div><p class="eyebrow"><span class="eyebrow-mark"></span>错题回看 · 把误区变成经验</p><h1>这些点再走一遍就稳了</h1><p>每条记录都保留了对应检查方向，不只记“选错了”。</p></div><button class="btn" data-review-clear>清空错题记录</button></div>' +
        '<div class="review-grid">'+cards+'</div><div class="end-row"><button class="btn btn-main" data-route="practice">去随机试炼 →</button></div>';
    }

    function render() {
      updateRank();
      document.querySelectorAll('[data-route]').forEach(function(item){
        item.classList.toggle('active',item.getAttribute('data-route')===route&&item.classList.contains('nav-link'));
      });
      if(route==='map')document.getElementById('app').innerHTML=renderMap();
      else if(route==='story')document.getElementById('app').innerHTML=renderStory();
      else if(route==='exam')document.getElementById('app').innerHTML=renderExam();
      else if(route==='sandbox')document.getElementById('app').innerHTML=renderSandbox();
      else if(route==='practice')document.getElementById('app').innerHTML=renderPractice();
      else document.getElementById('app').innerHTML=renderReview();
    }

    function resetExam() {
      exam.step=0; exam.choice=''; exam.values={}; exam.feedback=null;
      render();
    }

    function resetMain() {
      main.choice=''; main.order=[]; main.values={empty:'',full:'',mutex:''}; main.feedback=null;
      render();
    }

    function resetSimulation(mode, capacity) {
      const nextCapacity=capacity||sim.capacity;
      sim=makeSimulation(nextCapacity,mode||sim.mode,[]);
      render();
    }

    function deadlockDemo() {
      sim=makeSimulation(1,'risk',['已缓存数据包']);
      logSim('载入演示：缓冲区已满。让生产者先拿 mutex，再让它等待 empty。');
      save.deadlockSolved=false;
      render();
    }

    document.addEventListener('click',function(event){
      const el=event.target.closest('button,a[data-route]');
      if(!el)return;
      if(el.dataset.route){if(el.tagName==='A')event.preventDefault();route=el.dataset.route;render();return;}
      if(el.dataset.mainStage!==undefined){
        main.step=Number(el.dataset.mainStage);resetMain();route='story';render();return;
      }
      if(el.dataset.mainChoice){
        main.choice=el.dataset.mainChoice;main.feedback=null;render();return;
      }
      if(el.dataset.mainAction){
        const index=main.order.indexOf(el.dataset.mainAction);
        if(index>=0)main.order.splice(index,1);else main.order.push(el.dataset.mainAction);
        main.feedback=null;render();return;
      }
      if(el.dataset.mainRemove!==undefined){
        main.order.splice(Number(el.dataset.mainRemove),1);main.feedback=null;render();return;
      }
      if(el.dataset.mainValueKey){
        main.values[el.dataset.mainValueKey]=el.dataset.value;main.feedback=null;render();return;
      }
      if(el.dataset.mainSubmit!==undefined){
        if(main.step===0){
          const good=main.choice==='roles';
          const text=good?'对。先把生产者和消费者分开写，每类进程各有自己的循环动作。':'先数执行主体：负责放产品的是生产者，负责取产品的是消费者，通常各写一个循环函数。';
          if(good){if(!save.clearedMain.includes(0))save.clearedMain.push(0);award('main-0',10);}else addMistake('main-0','主线：辨认进程类别','生产者和消费者是两类执行主体，各写一个函数。');
          main.feedback={good:good,text:text};persist();render();return;
        }
        if(main.step===1){
          const good=main.order.length===MAIN_ANSWER.length&&main.order.every(function(item,index){return item===MAIN_ANSWER[index];});
          const text=good?'顺序对了：先申请空位，再拿互斥锁；写入后先放锁，再通知消费者。':'生产者先 P(empty)，再 P(mutex)；写入后 V(mutex)，最后 V(full)。';
          if(good){if(!save.clearedMain.includes(1))save.clearedMain.push(1);award('main-1',10);}else addMistake('main-1','主线：生产者动作排序','P(empty) → P(mutex) → 写入 → V(mutex) → V(full)。');
          main.feedback={good:good,text:text};persist();render();return;
        }
        if(main.step===2){
          const good=main.choice==='consumer';
          const text=good?'对。消费者先 P(full) 等产品，再用 mutex 保护取出动作；之后 V(mutex) 和 V(empty)。':'消费者先 P(full) 确认有产品，再 P(mutex)；取出后 V(mutex)，最后 V(empty)。';
          if(good){if(!save.clearedMain.includes(2))save.clearedMain.push(2);award('main-2',10);}else addMistake('main-2','主线：消费者 PV 次序','资源 P(full) 要先于互斥 P(mutex)。');
          main.feedback={good:good,text:text};persist();render();return;
        }
        if(main.step===3){
          const good=main.values.empty==='N'&&main.values.full==='0'&&main.values.mutex==='1';
          const text=good?'初值正确：empty=N、full=0、mutex=1。':'开局空仓：empty=N、full=0；mutex 可用，初值 1。';
          if(good){if(!save.clearedMain.includes(3))save.clearedMain.push(3);award('main-3',10);}else addMistake('main-3','主线：信号量初值','缓冲区空时 empty=N、full=0，mutex 初值 1。');
          main.feedback={good:good,text:text};persist();render();return;
        }
        if(main.step===4){
          const good=main.choice==='deadlock';
          const text=good?'会卡死：生产者持有 mutex 等 empty；消费者无法进入缓冲区取产品，也就无法释放空位。':'把缓冲区设成已满：谁拿着 mutex 等 empty？消费者能不能进去取货并腾出空位？';
          if(good){if(!save.clearedMain.includes(4))save.clearedMain.push(4);award('main-4',10);}else addMistake('main-4','主线：持锁等待导致死锁','持有 mutex 的生产者等待 empty，会阻止消费者取货。');
          main.feedback={good:good,text:text};persist();render();return;
        }
        const good=main.choice==='audit';
        const text=good?'检查完整了：资源 P、mutex P、临界区、V 释放顺序和初值都对得上。':'逐项核对资源 P、mutex P、临界区、V 的释放顺序和三种信号量初值。';
        if(good){if(!save.clearedMain.includes(5))save.clearedMain.push(5);award('main-5',10);}else addMistake('main-5','主线：完整解法自检','资源 P 在 mutex P 前；互斥临界区后释放锁，并通知资源变化。');
        main.feedback={good:good,text:text};persist();render();return;
      }
      if(el.dataset.mainNext!==undefined){
        main.step+=1;resetMainAnswer();render();return;
      }
      if(el.dataset.mainReset!==undefined){resetMain();return;}
      if(el.dataset.mainRestart!==undefined){main.step=0;resetMainAnswer();route='story';render();return;}

      if(el.dataset.examYear){exam.year=el.dataset.examYear;resetExam();return;}
      if(el.dataset.examChoice){exam.choice=el.dataset.examChoice;exam.feedback=null;render();return;}
      if(el.dataset.examValueKey){exam.values[el.dataset.examValueKey]=el.dataset.value;exam.feedback=null;render();return;}
      if(el.dataset.examSubmit!==undefined){examCheck();return;}
      if(el.dataset.examNext!==undefined){exam.step+=1;exam.choice='';exam.values={};exam.feedback=null;render();return;}
      if(el.dataset.examRetry!==undefined){resetExam();return;}

      if(el.dataset.simMode){resetSimulation(el.dataset.simMode);return;}
      if(el.dataset.simCap){resetSimulation(sim.mode,Number(el.dataset.simCap));return;}
      if(el.dataset.simStep){runSim(el.dataset.simStep);return;}
      if(el.dataset.simReset!==undefined){resetSimulation(sim.mode);return;}
      if(el.dataset.simDemo!==undefined){deadlockDemo();return;}

      if(el.dataset.practiceNew!==undefined){practice=makePractice();route='practice';render();return;}
      if(el.dataset.practiceChoice){practice.choice=el.dataset.practiceChoice;practice.feedback=null;render();return;}
      if(el.dataset.practiceValueKey){practice.values[el.dataset.practiceValueKey]=el.dataset.value;practice.feedback=null;render();return;}
      if(el.dataset.practiceSubmit!==undefined){checkPractice();return;}
      if(el.dataset.practiceNext!==undefined){
        if(practice.round===0){practice.round=1;practice.choice='';practice.feedback=null;}
        else{practice=makePractice();}
        render();return;
      }
      if(el.dataset.reviewClear!==undefined){save.mistakes=[];persist();render();return;}
    });

    render();
  </script>
</body>
</html>
